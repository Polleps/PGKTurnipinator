[install]
# npm-style node_modules layout: webpack 4/5 loaders resolve their peers from the hoisted tree.
linker = "hoisted"

[test]
root = "./test"
preload = ["./test/setup.ts"]

[fmt]
# `bun fmt` (Prettier-compatible). The codebase is not reformatted yet; use `bun run fmt:check`.
printWidth = 120
# The repo mixes CRLF and LF files; keep each file's own line endings
# (otherwise .editorconfig's end_of_line = crlf would apply to every file).
endOfLine = "auto"
